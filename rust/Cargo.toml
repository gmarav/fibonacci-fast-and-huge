[package]
name = "fib-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Exact Fibonacci algorithms with comparable Rust integer backends"
license = "MIT"
authors = ["Alexander Gmar"]
publish = false

[features]
default = []
gmp = ["dep:rug"]

[dependencies]
num-bigint = "0.5"
rayon = "1.12"
rug = { version = "1.30", optional = true, default-features = false, features = ["integer", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
